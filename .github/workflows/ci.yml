name: CI

on:
  workflow_call:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.11.6"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  TERRAFORM_VERSION: "1.9.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev --extra hosted
      - run: uv run ruff check app tests scripts

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev --extra hosted --extra ui
      - name: Adversarial API, authorization, async, cache, and migration isolation gate
        run: >-
          uv run pytest -q
          tests/security
          tests/test_alert_ingestion.py
          tests/test_knowledge_bundles.py
          tests/test_migration_cutover.py
          tests/test_migration_package.py
          tests/test_migration_service.py
        env:
          ENABLE_GRADIO_UI: "0"
      - name: Release-bound production readiness gate
        run: uv run pytest -q tests/readiness tests/ci tests/infra
      - name: Backend and self-hosted regression tests
        run: uv run pytest -q --ignore=tests/postgres
        env:
          ENABLE_GRADIO_UI: "0"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: aira_ci
          POSTGRES_USER: aira_migrator
          POSTGRES_PASSWORD: ci-migration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aira_migrator -d aira_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen --extra dev --extra hosted
      - name: Create isolated runtime role
        run: |
          set -euo pipefail
          docker exec "${{ job.services.postgres.id }}" psql \
            --username aira_migrator --dbname aira_ci --set=ON_ERROR_STOP=1 \
            --command "CREATE ROLE aira_app LOGIN PASSWORD 'ci-runtime-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS"
      - name: PostgreSQL migrations, repositories, and forced RLS
        env:
          AIRA_TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://aira_migrator:ci-migration-password@127.0.0.1:5432/aira_ci
          AIRA_TEST_DATABASE_URL: postgresql+psycopg://aira_app:ci-runtime-password@127.0.0.1:5432/aira_ci
          AIRA_DATABASE_MIGRATION_URL: postgresql+psycopg://aira_migrator:ci-migration-password@127.0.0.1:5432/aira_ci
        run: |
          set -euo pipefail
          uv run pytest tests/postgres/test_adversarial_tenant_isolation.py tests/postgres/test_migration_persistence.py tests/postgres/test_usage_quota_persistence.py -q
          uv run pytest tests/postgres -q
          uv run alembic check

  hosted-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Adversarial BFF authorization gate
        run: npm test -- --run src/test/approval-bff.test.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  v2-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build retained V2 static frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: Initialize hosted roots without remote backends
        run: |
          set -euo pipefail
          for root in hosted/envs/dev hosted/envs/prod hosted/customer-eventbridge; do
            terraform -chdir="infra/terraform/$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/$root" validate
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: mkdir -p security-reports
      - name: Python dependency audit
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --extra hosted --no-emit-project --format requirements-txt --output-file security-reports/requirements.txt
          uvx pip-audit==2.10.1 --disable-pip --no-deps --format json --output security-reports/pip-audit.json -r security-reports/requirements.txt
      - name: Node production dependency audits
        run: |
          set -euo pipefail
          npm --prefix web audit --omit=dev --audit-level=high --json > security-reports/web-npm-audit.json
          npm --prefix frontend audit --omit=dev --audit-level=high --json > security-reports/frontend-npm-audit.json
      - name: Bandit reviewed report and high-severity gate
        run: |
          set -euo pipefail
          uvx bandit==1.9.4 -r app -f json -o security-reports/bandit.json --exit-zero
          uvx bandit==1.9.4 -q -lll -r app
      - name: Checkov reviewed IaC report
        run: uvx checkov==3.3.19 -d infra/terraform/hosted --framework terraform --output json --output-file-path security-reports/checkov.json --soft-fail
      - name: Secret scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Source dependency and secret gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.74.0
      - name: Upload reviewed security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.run_id }}
          path: security-reports
          retention-days: 14
          if-no-files-found: warn

  containers:
    needs: [backend, postgres, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f Dockerfile.hosted -t aira-hosted:ci .
      - run: docker build -f web/Dockerfile -t aira-hosted-web:ci ./web
      - run: docker build -f Dockerfile -t aira-v2-api:ci .
      - run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000 -t aira-v2-web:ci ./frontend
