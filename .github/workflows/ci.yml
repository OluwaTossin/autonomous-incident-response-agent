# Phase 14 — lint, tests, Terraform validate, Docker image build, optional eval smoke (OpenAI secret).
#
# Branching: routine work on **dev**; merge to **main** via PR only (protect `main` in GitHub).

name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

# On main, do not cancel in-progress runs: merge + duplicate webhooks can start two
# runs for the same ref and cancel the first mid-job (red X on the default branch).
# On dev / PRs, cancel superseded runs so rapid pushes do not pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync (dev tools)
        run: uv sync --frozen --extra dev --extra hosted
      - name: Ruff
        run: uv run ruff check app tests scripts/ci

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.4"
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Init (no backend)
        working-directory: infra/terraform/envs/dev
        run: |
          rm -rf .terraform
          terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate (dev)
        working-directory: infra/terraform/envs/dev
        run: terraform validate
      - name: Init hosted roots (no backend)
        run: |
          for root in hosted/envs/dev hosted/envs/prod hosted/customer-eventbridge; do
            terraform -chdir="infra/terraform/${root}" init -backend=false -input=false -lockfile=readonly
          done
      - name: Validate hosted roots
        run: |
          terraform -chdir=infra/terraform/hosted/envs/dev validate
          terraform -chdir=infra/terraform/hosted/envs/prod validate
          terraform -chdir=infra/terraform/hosted/customer-eventbridge validate

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync
        run: uv sync --frozen --extra dev --extra hosted
      - name: Pytest (unit + integration)
        run: uv run pytest tests/unit tests/integration -q
        env:
          ENABLE_GRADIO_UI: "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

  hosted-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    needs: [test, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync (Dockerfile runs stub index script during image build)
        run: uv sync --frozen --extra dev --extra hosted
      - name: Docker build
        run: docker build -f Dockerfile -t aira-api:ci .
      - name: Docker build frontend (static nginx)
        run: docker build -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:18080 -t aira-ui:ci ./frontend
      - name: Docker build hosted API/worker image
        run: docker build -f Dockerfile.hosted -t aira-hosted:ci .
      - name: Docker build hosted web image
        run: docker build -f web/Dockerfile -t aira-hosted-web:ci ./web

  # Job-level `if` cannot use `secrets.*` (GitHub rejects it). Optional OpenAI steps run in shell.
  eval-smoke:
    needs: test
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync
        run: uv sync --frozen --extra dev --extra hosted
      - name: RAG build + triage-eval (skipped if no OPENAI_API_KEY secret)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGE_AUDIT_DISABLE: "1"
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "Skipping eval-smoke: add repository secret OPENAI_API_KEY to run live LLM checks."
            exit 0
          fi
          uv run rag-build
          uv run triage-eval --limit 3
