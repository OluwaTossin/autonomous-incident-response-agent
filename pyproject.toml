[project]
name = "autonomous-incident-response-agent"
version = "0.1.0"
description = "Autonomous DevOps incident response — RAG, agent, API (phased build)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.0",
    "openai>=2.30.0,<3",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "langgraph>=1.1.4",
    "langchain-openai>=1.1.14,<1.2",
    "langchain-core>=1.3.3,<1.4",
    "fastapi>=0.141.1,<0.142",
    "python-multipart>=0.0.31,<0.1",
    "uvicorn[standard]>=0.32.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.10.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
ui = ["gradio>=6.28.0,<6.29"]
hosted = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.scripts]
product-build-index = "app.product.cli:cli_build"
product-validate-workspace = "app.product.cli:cli_validate"
rag-build = "app.rag.cli:main_build"
rag-query = "app.rag.cli:main_query"
triage = "app.agent.cli:main"
triage-eval = "app.eval.cli:main"
serve-api = "app.api.server:main"
aira-migrate = "app.migration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2,<4.15",
    "click>=8.3.3,<8.4",
    "idna>=3.15,<3.16",
    "langgraph-checkpoint>=4.1.1,<4.2",
    "langgraph-sdk>=0.3.15,<0.4",
    "langsmith>=0.8.18,<0.9",
    "starlette>=1.3.1,<1.4",
    "urllib3>=2.7.0,<2.8",
    "pillow>=12.3.0,<12.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:builtin type SwigPyPacked:DeprecationWarning",
    "ignore:builtin type SwigPyObject:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]
